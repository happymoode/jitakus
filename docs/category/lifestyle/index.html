    <!-- SPA redirect handler for GitHub Pages & Static Hosting -->
    <script>
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        } else if (l.search) {
          var urlParams = new URLSearchParams(l.search);
          var p = urlParams.get('p');
          if (p) {
            var q = urlParams.get('q');
            var target = p + (q ? '?' + q.replace(/~and~/g, '&') : '') + l.hash;
            window.history.replaceState(null, null, target);
          }
        }
      })(window.location);
    </script>

    <!-- Development Vite Entry Point -->

    <!-- Universal Static Fallback: Guarantees full app execution on GitHub Pages even if deployed from repository root -->
    <script>
      (function() {
        function mountApp() {
          if (window.__appLoaded || window.__reactMounted) return;
          window.__appLoaded = true;

          // Load compiled CSS
          if (!document.querySelector('link[href*="assets/app.css"]')) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = '/assets/app.css';
            document.head.appendChild(link);
          }

          // Load compiled JS bundle
          if (!document.querySelector('script[src*="assets/app.js"]')) {
            var script = document.createElement('script');
            script.type = 'module';
            script.crossOrigin = 'anonymous';
            script.src = '/assets/app.js';
            document.head.appendChild(script);
          }
        }

        // Trigger on any TypeScript module loading error (expected on GitHub Pages static server)
        window.addEventListener('error', function(e) {
          if (e && ((e.filename && e.filename.indexOf('.tsx') !== -1) || (e.message && e.message.indexOf('.tsx') !== -1))) {
            mountApp();
          }
        }, true);

        // Immediate verification: if not mounted by Vite dev in 250ms, mount static production bundle
        setTimeout(function() {
          if (!window.__reactMounted) {
            mountApp();
          }
        }, 250);
      })();
    </script>
